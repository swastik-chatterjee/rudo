name: Build and Release Binary

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.1.0)"
        required: false
        type: string
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      asset_name: ${{ steps.bundle.outputs.asset_name }}
      release_tag: ${{ steps.meta.outputs.release_tag }}

    steps:
      - name: Install system dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git cargo rust pkgconf gtk4 gtk4-layer-shell curl

      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Cargo build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Verify source
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets

      - name: Derive version
        id: meta
        shell: bash
        run: |
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          
          ref_name="${{ inputs.tag_name }}"
          if [[ -z "$ref_name" ]]; then
            ref_name="${GITHUB_REF_NAME:-}"
          fi
          
          version="${ref_name#v}"
          if [[ -z "$version" || "$version" == "$ref_name" ]]; then
            version="$cargo_version"
          fi

          release_tag="v${version}"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        run: cargo build --release --locked

      - name: Prepare uncompressed binary
        id: bundle
        shell: bash
        run: |
          version="${{ steps.meta.outputs.version }}"
          mkdir -p dist

          asset_name="rudo-${version}-x86_64-linux"
          
          # Copy raw binary to dist/ with platform suffix
          cp target/release/rudo "dist/${asset_name}"
          chmod +x "dist/${asset_name}"

          echo "asset_name=${asset_name}" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-binary
          path: dist/rudo-*

  publish-github-release:
    runs-on: ubuntu-latest
    needs: build-release

    steps:
      - name: Download built archive
        uses: actions/download-artifact@v4
        with:
          name: release-binary
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-release.outputs.release_tag }}
          files: dist/${{ needs.build-release.outputs.asset_name }}
          generate_release_notes: true
