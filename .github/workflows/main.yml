name: Build and Release Binary

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.1.0)"
        required: false
        type: string
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      asset_name: ${{ steps.bundle.outputs.asset_name }}
      release_tag: ${{ steps.meta.outputs.release_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies & build gtk4-layer-shell
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-4-dev \
            libwayland-dev \
            gobject-introspection \
            libgirepository1.0-dev \
            meson \
            ninja-build \
            curl

          git clone https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
          cd /tmp/gtk4-layer-shell
          meson setup build
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: fmt, clippy

      - name: Verify source
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets

      - name: Derive version
        id: meta
        shell: bash
        run: |
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          
          ref_name="${{ inputs.tag_name }}"
          if [[ -z "$ref_name" ]]; then
            ref_name="${GITHUB_REF_NAME:-}"
          fi
          
          version="${ref_name#v}"
          if [[ -z "$version" || "$version" == "$ref_name" ]]; then
            version="$cargo_version"
          fi

          release_tag="v${version}"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        run: cargo build --release --locked

      - name: Bundle release archive
        id: bundle
        shell: bash
        run: |
          version='${{ steps.meta.outputs.version }}'
          mkdir -p dist/bundle
          install -Dm755 target/release/rudo dist/bundle/rudo
          install -Dm644 README.md dist/bundle/README.md
          install -Dm644 LICENSE dist/bundle/LICENSE
          install -Dm644 docs/rudo.service dist/bundle/rudo.service
          install -Dm644 docs/rudo.service dist/rudo.service
          asset_name="rudo-${version}-x86_64-linux.tar.gz"
          tar -C dist/bundle -czf "dist/${asset_name}" rudo README.md LICENSE rudo.service
          echo "asset_name=${asset_name}" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-archive
          path: |
            dist/${{ steps.bundle.outputs.asset_name }}
            dist/rudo.service

  publish-github-release:
    runs-on: ubuntu-latest
    needs: build-release

    steps:
      - name: Download built archive
        uses: actions/download-artifact@v4
        with:
          name: release-archive
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-release.outputs.release_tag }}
          files: |
            dist/${{ needs.build-release.outputs.asset_name }}
            dist/rudo.service
          generate_release_notes: true
